<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victory Nexus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <main class="card">
      <p class="label">Prueba técnica</p>
      <h1>Victory Nexus</h1>
      <p class="subtitle">Salir del navegador de Gmail</p>
      <p class="text">
        Pulsa el botón, elige Chrome en el menú de compartir
        y la página se abrirá fuera de Gmail.
      </p>
      <div class="actions">
        <button type="button" id="shareBtn" class="btn">Abrir en navegador externo</button>
        <button type="button" id="copyBtn" class="btn-icon" title="Copiar enlace" aria-label="Copiar enlace">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </button>
      </div>
    </main>
    <footer>Antonio Quijano &middot; 2026</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
